# ============================================================================
# NOTES FOR UI TOOL INTEGRATION
# ============================================================================
# 
# Entity Types Exposed:
#   - text_sensor.zone_status_json - JSON with all zone data
#   - binary_sensor.zone_X_occupancy - Individual zone occupancy (4 zones)
#   - sensor.target_X_x/y - Target positions for visualization (optional)
#   - number.zone_X_x1/y1/x2/y2 - Zone boundary configuration (16 numbers)
#   - select.installation_mode - Side/Top mount configuration
#   - button.restart_sensor - Restart sensor
#   - button.factory_reset_sensor - Reset to defaults
#
# JSON Format:
#   {"zones":[
#     {"id":1,"name":"Living Room","count":0,"occupied":false},
#     {"id":2,"name":"Hallway","count":0,"occupied":false},
#     {"id":3,"name":"Kitchen","count":0,"occupied":false},
#     {"id":4,"name":"Bedroom","count":0,"occupied":false}
#   ]}
#
# Zone Naming:
#   - Modify the lambda in zone_status_json text sensor
#   - Or parse/override in your UI tool
#
# Adding More Zones:
#   1. Add zone globals (x1, y1, x2, y2)
#   2. Add zone boundary numbers
#   3. Add zone occupancy binary sensor
#   4. Update zone_status_json lambda
#
# ============================================================================
