        name: "Target 2 X"
        icon: mdi:axis-x-arrow
        disabled_by_default: true
        filters:
          - timeout: ${target_timeout}
      y:
        name: "Target 2 Y"
        icon: mdi:axis-y-arrow
        disabled_by_default: true
        filters:
          - timeout: ${target_timeout}
      angle:
        name: "Target 2 Angle"
        icon: mdi:angle-acute
        disabled_by_default: true
        filters:
          - timeout: ${target_timeout}
      distance:
        name: "Target 2 Distance"
        icon: mdi:ruler
        disabled_by_default: true
        filters:
          - timeout: ${target_timeout}
  
  # Target 3
  - platform: ld2460
    ld2460_id: ld2460_radar
    target_3:
      x:
        name: "Target 3 X"
        icon: mdi:axis-x-arrow
        disabled_by_default: true
        filters:
          - timeout: ${target_timeout}
      y:
        name: "Target 3 Y"
        icon: mdi:axis-y-arrow
        disabled_by_default: true
        filters:
          - timeout: ${target_timeout}
      angle:
