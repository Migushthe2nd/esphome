# LD2460 Presence Detection - Complete Configuration
# Production-ready ESPHome configuration for HLK-LD2460 24GHz radar sensor
# 
# This configuration provides:
# - Complete sensor entity exposure
# - Software-based zone system (4 zones, easily extensible)
# - JSON zone reporting for UI tools
# - Individual zone occupancy sensors
# - Runtime-configurable zone boundaries
# - Target tracking and diagnostics
# - Clean, maintainable structure
#
# Hardware Setup:
# - ESP32 (recommended) or ESP8266
# - LD2460 radar sensor connected via UART
# - Default pins: TX=GPIO4, RX=GPIO5
#
# Usage:
# 1. Customize substitutions below for your setup
# 2. Enable/disable optional sensors as needed
# 3. Configure zone boundaries in Home Assistant
# 4. Use zone_status_json for UI tool integration

substitutions:
  # Device Configuration
  device_name: "ld2460-presence"
  device_friendly_name: "LD2460 Presence Sensor"
  
  # UART Pins
  uart_tx_pin: GPIO4
  uart_rx_pin: GPIO5
  uart_baud_rate: "115200"
  
  # Zone Update Settings
  zone_update_interval: "250ms"
  zone_delayed_off: "5s"
  
  # Target Settings
  target_timeout: "5s"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  platform: ESP32
  board: esp32dev

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot in case WiFi connection fails
  ap:
    ssid: "${device_friendly_name} Fallback"
    password: !secret ap_password

# Enable logging
logger:
  level: INFO
  # Reduce UART logging to avoid conflicts
  logs:
    sensor: INFO
    binary_sensor: INFO
    text_sensor: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  password: !secret ota_password

# Web server for local access
web_server:
  port: 80

# UART Configuration for LD2460
uart:
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: ${uart_baud_rate}
  # Important: Use hardware UART for ESP32
  # For ESP8266, software UART is used automatically

# ============================================================================
# LD2460 Component Configuration
# ============================================================================

ld2460:
  id: ld2460_radar

# ============================================================================
# Zone Configuration - Software-based zones calculated on ESP32
# ============================================================================
# Coordinate system:
#   X-axis: Left (-) to Right (+), centered at sensor (0)
#   Y-axis: Near (0) to Far (+), distance from sensor
#   Units: millimeters (mm)
#
# Zone layout (default 4 zones):
#   Zone 1: Living Room (center, near-mid range)
#   Zone 2: Hallway (center, far range)
#   Zone 3: Kitchen (right side)
#   Zone 4: Bedroom (left side)

globals:
  # Zone 1 - Living Room (Center, Near-Mid Range)
  - id: zone1_x1
    type: int
    initial_value: '-1500'  # Left edge: -1.5m
    restore_value: false
  - id: zone1_y1
    type: int
    initial_value: '0'      # Near edge: 0m (sensor position)
    restore_value: false
  - id: zone1_x2
    type: int
    initial_value: '1500'   # Right edge: +1.5m
    restore_value: false
  - id: zone1_y2
    type: int
    initial_value: '3000'   # Far edge: 3m
    restore_value: false
  
  # Zone 2 - Hallway (Center, Far Range)
  - id: zone2_x1
    type: int
    initial_value: '-800'   # Left edge: -0.8m
    restore_value: false
  - id: zone2_y1
    type: int
    initial_value: '3000'   # Near edge: 3m
    restore_value: false
  - id: zone2_x2
    type: int
    initial_value: '800'    # Right edge: +0.8m
    restore_value: false
  - id: zone2_y2
    type: int
    initial_value: '6000'   # Far edge: 6m
    restore_value: false
  
  # Zone 3 - Kitchen (Right Side)
  - id: zone3_x1
    type: int
    initial_value: '1500'   # Left edge: +1.5m
    restore_value: false
  - id: zone3_y1
    type: int
    initial_value: '0'      # Near edge: 0m
    restore_value: false
  - id: zone3_x2
    type: int
    initial_value: '3000'   # Right edge: +3m
    restore_value: false
  - id: zone3_y2
    type: int
    initial_value: '3000'   # Far edge: 3m
    restore_value: false
  
  # Zone 4 - Bedroom (Left Side)
  - id: zone4_x1
    type: int
    initial_value: '-3000'  # Left edge: -3m
    restore_value: false
  - id: zone4_y1
    type: int
    initial_value: '0'      # Near edge: 0m
    restore_value: false
  - id: zone4_x2
    type: int
    initial_value: '-1500'  # Right edge: -1.5m
    restore_value: false
  - id: zone4_y2
    type: int
    initial_value: '3000'   # Far edge: 3m
    restore_value: false

# ============================================================================
# Text Sensors
# ============================================================================

text_sensor:
  # Firmware Version
  - platform: ld2460
    ld2460_id: ld2460_radar
    version:
      name: "Firmware Version"
      entity_category: diagnostic
      icon: mdi:chip
  
  # Zone Status JSON - SINGLE sensor for ALL zone data
  # Perfect for UI tool integration - no entity bloat!
  - platform: template
    name: "Zone Status JSON"
    id: zone_status_json
    update_interval: ${zone_update_interval}
    icon: mdi:map-marker-multiple
    lambda: |-
      // Calculate zone occupancy and counts
      int zone_counts[4] = {0, 0, 0, 0};
      
      // Check each target against all zones
      for (int i = 0; i < 3; i++) {
        auto target = id(ld2460_radar).get_target(i);
        if (target.valid) {
          int x = target.x;
          int y = target.y;
          
          // Zone 1 check (Living Room)
          if (x >= id(zone1_x1) && x <= id(zone1_x2) &&
              y >= id(zone1_y1) && y <= id(zone1_y2)) {
            zone_counts[0]++;
          }
          
          // Zone 2 check (Hallway)
          if (x >= id(zone2_x1) && x <= id(zone2_x2) &&
              y >= id(zone2_y1) && y <= id(zone2_y2)) {
            zone_counts[1]++;
          }
          
          // Zone 3 check (Kitchen)
          if (x >= id(zone3_x1) && x <= id(zone3_x2) &&
              y >= id(zone3_y1) && y <= id(zone3_y2)) {
            zone_counts[2]++;
          }
          
          // Zone 4 check (Bedroom)
          if (x >= id(zone4_x1) && x <= id(zone4_x2) &&
              y >= id(zone4_y1) && y <= id(zone4_y2)) {
            zone_counts[3]++;
          }
        }
      }
      
      // Build JSON response
      // Format: {"zones":[{"id":1,"name":"Living Room","count":0,"occupied":false},...]}
      std::string json = "{\"zones\":[";
      json += "{\"id\":1,\"name\":\"Living Room\",\"count\":" + std::to_string(zone_counts[0]) + 
              ",\"occupied\":" + (zone_counts[0] > 0 ? "true" : "false") + "},";
      json += "{\"id\":2,\"name\":\"Hallway\",\"count\":" + std::to_string(zone_counts[1]) + 
              ",\"occupied\":" + (zone_counts[1] > 0 ? "true" : "false") + "},";
      json += "{\"id\":3,\"name\":\"Kitchen\",\"count\":" + std::to_string(zone_counts[2]) + 
              ",\"occupied\":" + (zone_counts[2] > 0 ? "true" : "false") + "},";
      json += "{\"id\":4,\"name\":\"Bedroom\",\"count\":" + std::to_string(zone_counts[3]) + 
              ",\"occupied\":" + (zone_counts[3] > 0 ? "true" : "false") + "}";
      json += "]}";
      
      return json;

# ============================================================================
# Binary Sensors - Presence Detection
# ============================================================================

binary_sensor:
  # Overall presence detection
  - platform: ld2460
    ld2460_id: ld2460_radar
    has_target:
      name: "Presence"
      device_class: occupancy
      icon: mdi:motion-sensor
  
  # Individual Zone Occupancy Sensors
  # Uses delayed_off to prevent flickering
  
  - platform: template
    name: "Zone 1 Occupancy"
    id: zone1_occupancy
    device_class: occupancy
    icon: mdi:sofa
    lambda: |-
      for (int i = 0; i < 3; i++) {
        auto target = id(ld2460_radar).get_target(i);
        if (target.valid) {
          if (target.x >= id(zone1_x1) && target.x <= id(zone1_x2) &&
              target.y >= id(zone1_y1) && target.y <= id(zone1_y2)) {
            return true;
          }
        }
      }
      return false;
    filters:
      - delayed_off: ${zone_delayed_off}
  
  - platform: template
    name: "Zone 2 Occupancy"
    id: zone2_occupancy
    device_class: occupancy
    icon: mdi:door
    lambda: |-
      for (int i = 0; i < 3; i++) {
        auto target = id(ld2460_radar).get_target(i);
        if (target.valid) {
          if (target.x >= id(zone2_x1) && target.x <= id(zone2_x2) &&
              target.y >= id(zone2_y1) && target.y <= id(zone2_y2)) {
            return true;
          }
        }
      }
      return false;
    filters:
      - delayed_off: ${zone_delayed_off}
  
  - platform: template
    name: "Zone 3 Occupancy"
    id: zone3_occupancy
    device_class: occupancy
    icon: mdi:silverware-fork-knife
    lambda: |-
      for (int i = 0; i < 3; i++) {
        auto target = id(ld2460_radar).get_target(i);
        if (target.valid) {
          if (target.x >= id(zone3_x1) && target.x <= id(zone3_x2) &&
              target.y >= id(zone3_y1) && target.y <= id(zone3_y2)) {
            return true;
          }
        }
      }
      return false;
    filters:
      - delayed_off: ${zone_delayed_off}
  
  - platform: template
    name: "Zone 4 Occupancy"
    id: zone4_occupancy
    device_class: occupancy
    icon: mdi:bed
    lambda: |-
      for (int i = 0; i < 3; i++) {
        auto target = id(ld2460_radar).get_target(i);
        if (target.valid) {
          if (target.x >= id(zone4_x1) && target.x <= id(zone4_x2) &&
              target.y >= id(zone4_y1) && target.y <= id(zone4_y2)) {
            return true;
          }
        }
      }
      return false;
    filters:
      - delayed_off: ${zone_delayed_off}

# ============================================================================
# Sensors - Measurements and Diagnostics
# ============================================================================

sensor:
  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
  
  # Uptime
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  
  # Target Count - How many targets are currently detected
  - platform: ld2460
    ld2460_id: ld2460_radar
    target_count:
      name: "Target Count"
      icon: mdi:counter
      filters:
        - throttle_average: 1s
  
  # ============================================================================
  # Target Position Sensors - Enable for debugging or visualization
  # Comment out or set disabled_by_default: true for production
  # ============================================================================
  
  # Target 1
  - platform: ld2460
    ld2460_id: ld2460_radar
    target_1:
      x:
        name: "Target 1 X"
        icon: mdi:axis-x-arrow
        disabled_by_default: true
        filters:
          - timeout: ${target_timeout}
      y:
        name: "Target 1 Y"
        icon: mdi:axis-y-arrow
        disabled_by_default: true
        filters:
          - timeout: ${target_timeout}
      angle:
        name: "Target 1 Angle"
        icon: mdi:angle-acute
        disabled_by_default: true
        filters:
          - timeout: ${target_timeout}
      distance:
        name: "Target 1 Distance"
        icon: mdi:ruler
        disabled_by_default: true
        filters:
