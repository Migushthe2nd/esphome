  - platform: template
    name: "Zone 1 X1 (Left)"
    id: zone1_x1_config
    entity_category: config
    min_value: -6000
    max_value: 6000
    step: 100
    unit_of_measurement: "mm"
    mode: box
    icon: mdi:arrow-left
    optimistic: true
    restore_value: true
    initial_value: -1500
    on_value:
      then:
        - lambda: 'id(zone1_x1) = (int)x;'
  
  - platform: template
