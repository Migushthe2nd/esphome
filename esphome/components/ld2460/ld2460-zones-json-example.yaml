# LD2460 Software Zones Example - JSON Approach
# This demonstrates the cleanest way to implement zones without entity bloat
# Uses a single JSON text sensor for all zone data

esphome:
  name: ld2460-zones-json
  platform: ESP32
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password

# Zone configuration - easily adjustable
globals:
  # Zone 1: Living Room (rectangle)
  - id: zone1_x1
    type: int
    initial_value: '-1500'
    restore_value: false
  - id: zone1_y1
    type: int
    initial_value: '0'
    restore_value: false
  - id: zone1_x2
    type: int
    initial_value: '1500'
    restore_value: false
  - id: zone1_y2
    type: int
    initial_value: '3000'
    restore_value: false
  
  # Zone 2: Hallway (rectangle)
  - id: zone2_x1
    type: int
    initial_value: '-800'
    restore_value: false
  - id: zone2_y1
    type: int
    initial_value: '3000'
    restore_value: false
  - id: zone2_x2
    type: int
    initial_value: '800'
    restore_value: false
  - id: zone2_y2
    type: int
    initial_value: '5000'
    restore_value: false
  
  # Zone 3: Kitchen (rectangle)
  - id: zone3_x1
    type: int
    initial_value: '1500'
    restore_value: false
  - id: zone3_y1
    type: int
    initial_value: '0'
    restore_value: false
  - id: zone3_x2
    type: int
    initial_value: '3000'
    restore_value: false
  - id: zone3_y2
    type: int
    initial_value: '2500'
    restore_value: false
  
  # Zone 4: Bedroom (rectangle)
  - id: zone4_x1
    type: int
    initial_value: '-3000'
    restore_value: false
  - id: zone4_y1
    type: int
    initial_value: '0'
    restore_value: false
  - id: zone4_x2
    type: int
    initial_value: '-1500'
    restore_value: false
  - id: zone4_y2
    type: int
    initial_value: '2500'
    restore_value: false

uart:
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 115200

# LD2460 Radar Sensor
ld2460:
  id: ld2460_radar

# SINGLE text sensor with ALL zone data - NO ENTITY BLOAT!
text_sensor:
  - platform: template
    name: "Zone Status JSON"
    id: zone_status_json
    update_interval: 250ms
    lambda: |-
      // Calculate zone occupancy and counts
      int zone_counts[4] = {0, 0, 0, 0};
      
      // Check each target against all zones
      for (int i = 0; i < 3; i++) {
        auto target = id(ld2460_radar).get_target(i);
        if (target.valid) {
          int x = target.x;
          int y = target.y;
          
          // Zone 1 check
          if (x >= id(zone1_x1) && x <= id(zone1_x2) &&
              y >= id(zone1_y1) && y <= id(zone1_y2)) {
            zone_counts[0]++;
          }
          
          // Zone 2 check
          if (x >= id(zone2_x1) && x <= id(zone2_x2) &&
              y >= id(zone2_y1) && y <= id(zone2_y2)) {
            zone_counts[1]++;
          }
          
          // Zone 3 check
          if (x >= id(zone3_x1) && x <= id(zone3_x2) &&
              y >= id(zone3_y1) && y <= id(zone3_y2)) {
            zone_counts[2]++;
          }
          
          // Zone 4 check
          if (x >= id(zone4_x1) && x <= id(zone4_x2) &&
              y >= id(zone4_y1) && y <= id(zone4_y2)) {
            zone_counts[3]++;
          }
        }
      }
      
      // Build JSON response
      std::string json = "{\"zones\":[";
      json += "{\"id\":1,\"name\":\"Living Room\",\"count\":" + std::to_string(zone_counts[0]) + 
              ",\"occupied\":" + (zone_counts[0] > 0 ? "true" : "false") + "},";
      json += "{\"id\":2,\"name\":\"Hallway\",\"count\":" + std::to_string(zone_counts[1]) + 
              ",\"occupied\":" + (zone_counts[1] > 0 ? "true" : "false") + "},";
      json += "{\"id\":3,\"name\":\"Kitchen\",\"count\":" + std::to_string(zone_counts[2]) + 
              ",\"occupied\":" + (zone_counts[2] > 0 ? "true" : "false") + "},";
      json += "{\"id\":4,\"name\":\"Bedroom\",\"count\":" + std::to_string(zone_counts[3]) + 
              ",\"occupied\":" + (zone_counts[3] > 0 ? "true" : "false") + "}";
      json += "]}";
      
      return json;
  
  - platform: ld2460
    ld2460_id: ld2460_radar
    version:
      name: "Firmware Version"

# Optional: Traditional binary sensors for backward compatibility
# (Or use Home Assistant template sensors from the JSON instead)
binary_sensor:
  - platform: template
    name: "Living Room Occupancy"
    id: zone1_occupancy
    device_class: occupancy
    lambda: |-
      for (int i = 0; i < 3; i++) {
        auto target = id(ld2460_radar).get_target(i);
        if (target.valid) {
          if (target.x >= id(zone1_x1) && target.x <= id(zone1_x2) &&
              target.y >= id(zone1_y1) && target.y <= id(zone1_y2)) {
            return true;
          }
        }
      }
      return false;
    filters:
      - delayed_off: 5s

# Optional: Number entities for zone configuration from Home Assistant
number:
  - platform: template
    name: "Zone 1 X1 (Left)"
    id: zone1_x1_config
    min_value: -6000
    max_value: 6000
    step: 100
    unit_of_measurement: "mm"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: -1500
    on_value:
      then:
        - lambda: 'id(zone1_x1) = (int)x;'
  
  - platform: template
    name: "Zone 1 Y1 (Near)"
    id: zone1_y1_config
    min_value: 0
    max_value: 6000
    step: 100
    unit_of_measurement: "mm"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
    on_value:
      then:
        - lambda: 'id(zone1_y1) = (int)x;'
  
  - platform: template
    name: "Zone 1 X2 (Right)"
    id: zone1_x2_config
    min_value: -6000
    max_value: 6000
    step: 100
    unit_of_measurement: "mm"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1500
    on_value:
      then:
        - lambda: 'id(zone1_x2) = (int)x;'
  
  - platform: template
    name: "Zone 1 Y2 (Far)"
    id: zone1_y2_config
    min_value: 0
    max_value: 6000
    step: 100
    unit_of_measurement: "mm"
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 3000
    on_value:
      then:
        - lambda: 'id(zone1_y2) = (int)x;'

# Debug sensors (optional - disable in production)
sensor:
  - platform: ld2460
    ld2460_id: ld2460_radar
    target_count:
      name: "Total Target Count"
    
    # Uncomment for debugging target positions
    # target_1:
    #   x:
    #     name: "Target 1 X"
    #   y:
    #     name: "Target 1 Y"
    #   distance:
    #     name: "Target 1 Distance"
